name: Build XRomConverter
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build Solution
        shell: cmd
        run: |
          for /r %%i in (*.sln) do (
            msbuild "%%i" /p:Configuration=Release /p:Platform=x64
          )
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XRomConverter-Win64
          path: '**/bin/Release/net*-windows/win-x64/publish/'
