name: Build XRomConverter Fixed
on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout Standalone Code
      uses: actions/checkout@v4
      with:
        submodules: 'false'

    - name: Force Download Dependency Directly
      run: |
        rmdir /s /q Dependencies\MikuMikuLibrary
        git clone https://github.com Dependencies/MikuMikuLibrary

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore NuGet Packages
      run: |
        dotnet restore XRomConverter/XRomConverter.csproj
        dotnet restore Dependencies/MikuMikuLibrary/MikuMikuLibrary/MikuMikuLibrary.csproj

    - name: Add MSBuild to Path
      uses: microsoft/setup-msbuild@v2

    - name: Build Solution
      run: msbuild XRomConverter.sln /p:Configuration=Release /p:Platform="Any CPU"

    - name: Upload Compiled Executable
      uses: actions/upload-artifact@v4
      with:
        name: XRomConverter-Windows
        path: |
          **/bin/Release/**
